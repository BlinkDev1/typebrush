<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TypeRush — Digitação Rápida</title>
<style>
:root{--bg:#0b0d12;--panel:#141821;--panel2:#1b2030;--line:#262c3d;--txt:#e7eaf2;--mut:#7d869c;--acc:#7c5cff;--acc2:#22d3ee;--ok:#34d399;--bad:#f43f5e;--warn:#fbbf24}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,"Segoe UI",system-ui,sans-serif;background:radial-gradient(1200px 600px at 50% -10%,#1d1640 0%,var(--bg) 60%);color:var(--txt);min-height:100vh;display:flex;flex-direction:column;align-items:center;user-select:none;overflow-x:hidden}
header{width:100%;max-width:1000px;display:flex;justify-content:space-between;align-items:center;padding:22px 24px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px}
.logo span{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;color:transparent}
.ctrls{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button,.btn{background:none;border:0;color:var(--mut);font:600 13px inherit;font-family:inherit;padding:7px 12px;border-radius:7px;cursor:pointer;transition:.2s}
.seg button.on{background:var(--panel2);color:var(--txt);box-shadow:0 0 0 1px var(--line)}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--txt)}
.btn:hover{border-color:var(--acc)}
main{width:100%;max-width:1000px;padding:0 24px;flex:1;display:flex;flex-direction:column;gap:22px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.stat small{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:1.2px}
.lives{color:var(--bad);letter-spacing:3px}
.stage{position:relative;background:linear-gradient(180deg,var(--panel),#10131b);border:1px solid var(--line);border-radius:22px;padding:42px 24px 30px;text-align:center;overflow:hidden}
.ring{position:absolute;top:18px;right:22px;width:74px;height:74px}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .bgc{stroke:var(--line)}
.ring .fg{stroke:var(--acc2);stroke-linecap:round;transition:stroke .3s}
.ring .sec{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.combo{position:absolute;top:22px;left:24px;font-weight:800;color:var(--warn);font-size:15px;opacity:0;transition:.3s}
.combo.show{opacity:1}
.word{font-family:"JetBrains Mono",Consolas,monospace;font-size:clamp(40px,8vw,76px);font-weight:700;letter-spacing:4px;min-height:96px;display:flex;justify-content:center;align-items:center}
.word span{color:#4a5168;transition:color .12s,transform .12s;display:inline-block}
.word span.ok{color:var(--txt);text-shadow:0 0 24px rgba(124,92,255,.6)}
.word span.bad{color:var(--bad);animation:shake .25s}
.word span.cur{border-bottom:3px solid var(--acc2)}
.next{margin-top:10px;color:var(--mut);font-family:Consolas,monospace;font-size:17px;letter-spacing:1px}
.next i{font-style:normal;opacity:.55;margin:0 8px}
.bar{height:4px;background:var(--line);border-radius:3px;margin-top:26px;overflow:hidden}
.bar div{height:100%;width:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transform-origin:left}
.hint{color:var(--mut);font-size:13px;margin-top:14px}
.stage.flash-ok{animation:fok .4s}
.stage.flash-bad{animation:fbad .4s}
@keyframes fok{0%{box-shadow:0 0 0 0 rgba(52,211,153,.6)}100%{box-shadow:0 0 0 18px rgba(52,211,153,0)}}
@keyframes fbad{0%{box-shadow:0 0 0 0 rgba(244,63,94,.6)}100%{box-shadow:0 0 0 18px rgba(244,63,94,0)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.pop{position:absolute;font-weight:800;color:var(--ok);pointer-events:none;animation:up 0.9s forwards;font-size:20px}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
.kb{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px;margin-bottom:28px}
.row{display:flex;gap:8px;justify-content:center}
.key{position:relative;overflow:hidden;flex:0 0 56px;height:56px;background:linear-gradient(180deg,#232a3b,#1a1f2c);border:1px solid #2e3548;border-bottom:4px solid #0f121a;border-radius:11px;color:var(--txt);font:600 16px inherit;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .08s,border-color .15s,background .15s}
.key.w15{flex-basis:90px;font-size:13px}.key.w2{flex-basis:120px;font-size:13px}.key.space{flex-basis:380px}
.key.hl{border-color:var(--acc2);box-shadow:0 0 14px rgba(34,211,238,.35)}
.key.press{transform:translateY(3px) scale(.96);border-bottom-width:1px;background:linear-gradient(180deg,#3a2f80,#2a2260)}
.key.press.err{background:linear-gradient(180deg,#7f1d32,#5a1424)}
.rip{position:absolute;border-radius:50%;background:rgba(124,92,255,.55);transform:scale(0);animation:rip .55s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.burst{position:fixed;width:6px;height:6px;border-radius:50%;pointer-events:none;z-index:50}
.overlay{position:fixed;inset:0;background:rgba(5,6,10,.75);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:20}
.overlay.hide{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:36px 40px;text-align:center;max-width:440px;width:92%;animation:in .35s}
@keyframes in{from{transform:scale(.92);opacity:0}}
.card h2{font-size:28px;margin-bottom:8px}
.card p{color:var(--mut);margin-bottom:22px;line-height:1.5}
.res{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.res div{background:var(--panel2);border-radius:12px;padding:12px}
.res b{display:block;font-size:22px}.res small{color:var(--mut);font-size:11px;text-transform:uppercase}
.go{background:linear-gradient(90deg,var(--acc),#5b8cff);border:0;color:#fff;font:700 16px inherit;font-family:inherit;padding:14px 34px;border-radius:12px;cursor:pointer;box-shadow:0 10px 30px rgba(124,92,255,.35);transition:.2s}
.go:hover{transform:translateY(-2px)}
@media(max-width:760px){.stats{grid-template-columns:repeat(3,1fr)}.key{flex:1 1 0;height:46px;font-size:14px}.key.space{flex:6}.row{gap:5px}}
</style>
</head>
<body>
<header>
  <div class="logo">Type<span>Rush</span></div>
  <div class="ctrls">
    <div class="seg" id="diff">
      <button data-d="easy">Fácil</button><button data-d="normal" class="on">Normal</button><button data-d="hard">Difícil</button>
    </div>
    <div class="seg" id="acc"><button data-a="1" class="on">Com acentos</button><button data-a="0">Sem acentos</button></div>
    <button class="btn" id="restart">Reiniciar</button>
  </div>
</header>
<main>
  <div class="stats">
    <div class="stat"><small>Pontos</small><b id="sScore">0</b></div>
    <div class="stat"><small>Palavras</small><b id="sWords">0</b></div>
    <div class="stat"><small>PPM</small><b id="sWpm">0</b></div>
    <div class="stat"><small>Precisão</small><b id="sAcc">100%</b></div>
    <div class="stat"><small>Vidas</small><b class="lives" id="sLives">♥♥♥</b></div>
  </div>
  <div class="stage" id="stage">
    <div class="combo" id="combo">x1 COMBO</div>
    <div class="ring"><svg width="74" height="74"><circle class="bgc" cx="37" cy="37" r="31"/><circle class="fg" id="ringFg" cx="37" cy="37" r="31" stroke-dasharray="194.8" stroke-dashoffset="0"/></svg><div class="sec" id="sec">0.0</div></div>
    <div class="word" id="word"></div>
    <div class="next" id="next"></div>
    <div class="bar"><div id="bar"></div></div>
    <div class="hint">Escreve no teclado físico ou clica nas teclas · <b>Backspace</b> apaga · <b>Esc</b> pausa</div>
  </div>
  <div class="kb" id="kb"></div>
</main>

<div class="overlay" id="ov"><div class="card" id="card"></div></div>

function ripple(b,e){const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height),d=document.createElement('span');
 d.className='rip';d.style.width=d.style.height=s+'px';
 const x=e?e.clientX-r.left:r.width/2,y=e?e.clientY-r.top:r.height/2;
 d.style.left=x-s/2+'px';d.style.top=y-s/2+'px';b.appendChild(d);setTimeout(()=>d.remove(),600)}
function burst(x,y,col){for(let i=0;i<8;i++){const p=document.createElement('div');p.className='burst';
 p.style.left=x+'px';p.style.top=y+'px';p.style.background=col||(i%2?'#22d3ee':'#7c5cff');document.body.appendChild(p);
 const a=Math.PI*2*i/8,d=30+Math.random()*25;
 p.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(0)`,opacity:0}],{duration:500,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>p.remove()}}

function render(){
 $('word').innerHTML=[...word].map((c,i)=>{let cl=i<typed.length?(typed[i]===c?'ok':'bad'):(i===typed.length?'cur':'');return `<span class="${cl}">${c}</span>`}).join('');
 $('next').innerHTML=queue.slice(0,3).map(w=>`<i>${w}</i>`).join('');
 highlight()}
function stats(){$('sScore').textContent=score;$('sWords').textContent=words;
 const min=(performance.now()-startT)/60000;$('sWpm').textContent=min>0.02?Math.round(chars/5/min):0;
 $('sAcc').textContent=keys?Math.round(good/keys*100)+'%':'100%';
 $('sLives').textContent='♥'.repeat(lives)+'♡'.repeat(3-lives);
 const c=$('combo');c.textContent='x'+(1+Math.floor(combo/5))+' COMBO · '+combo;c.classList.toggle('show',combo>=3)}
function input(ch,fromVirtual){
 if(state!=='play'){if(state==='idle'||state==='over')start();else if(state==='pause')resume();return}
 const exp=word[typed.length];if(exp===undefined)return;
 const ok=ch===exp;keys++;if(ok)good++;
 const k=keyFor(ch)||keyFor(exp);if(!fromVirtual&&k)press(k,!ok);else if(k&&!ok)press(k,true);
 if(!ok){combo=0;flash('bad');typed+=ch;render();setTimeout(()=>{typed=typed.slice(0,-1);render()},180);stats();return}
 typed+=ch;render();
 if(typed===word)complete();stats()}
function back(){if(state==='play'&&typed.length){typed=typed.slice(0,-1);press('⌫');render()}}
function complete(){words++;combo++;chars+=word.length+1;
 const mult=1+Math.floor(combo/5),pts=Math.round((word.length*10+tLeft/tLimit*50)*mult);score+=pts;
 const r=$('stage').getBoundingClientRect(),p=document.createElement('div');p.className='pop';p.textContent='+'+pts;
 p.style.left='50%';p.style.top='40%';$('stage').appendChild(p);setTimeout(()=>p.remove(),900);
 burst(r.left+r.width/2,r.top+r.height*.45,'#34d399');flash('ok');newWord()}
function flash(t){const s=$('stage');s.classList.remove('flash-ok','flash-bad');void s.offsetWidth;s.classList.add('flash-'+t)}
function timeout(){lives--;combo=0;flash('bad');stats();if(lives<=0)return over();newWord()}
function loop(t){if(state!=='play')return;const dt=(t-last)/1000;last=t;tLeft-=dt;
 if(tLeft<=0){tLeft=0;timeout()}
 const f=Math.max(0,tLeft/tLimit);$('sec').textContent=tLeft.toFixed(1);
 $('ringFg').style.strokeDashoffset=194.8*(1-f);$('ringFg').style.stroke=f<.3?'var(--bad)':f<.6?'var(--warn)':'var(--acc2)';
 $('bar').style.transform=`scaleX(${f})`;
 if(state==='play')requestAnimationFrame(loop)}
function start(){score=0;words=0;lives=3;combo=0;keys=0;good=0;chars=0;queue=[];state='play';$('ov').classList.add('hide');
 startT=performance.now();newWord();stats();last=performance.now();requestAnimationFrame(loop)}
function pause(){if(state!=='play')return;state='pause';card('Pausa','O jogo está em pausa.',null,'Continuar')}
function resume(){state='play';$('ov').classList.add('hide');last=performance.now();requestAnimationFrame(loop)}
function over(){state='over';const nb=score>best;if(nb){best=score;localStorage.typerushBest=best}
 card(nb?'🏆 Novo recorde!':'Fim de jogo','Boa! Aqui está o teu resultado.',
 [['Pontos',score],['Palavras',words],['PPM',$('sWpm').textContent],['Precisão',$('sAcc').textContent],['Combo',combo],['Recorde',best]],'Jogar de novo')}
function card(h,p,res,btn){$('card').innerHTML=`<h2>${h}</h2><p>${p}</p>`+(res?`<div class="res">${res.map(r=>`<div><small>${r[0]}</small><b>${r[1]}</b></div>`).join('')}</div>`:'')+`<button class="go" id="goBtn">${btn}</button>`;
 $('ov').classList.remove('hide');$('goBtn').onclick=()=>state==='pause'?resume():start()}

document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){state==='play'?pause():state==='pause'&&resume();return}
 if(e.key==='Backspace'){e.preventDefault();return back()}
 if(e.key===' '||e.key==='Enter'){e.preventDefault();if(state!=='play')state==='pause'?resume():start();return}
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 if(e.key.length===1){e.preventDefault();input(e.key.toLowerCase())}});

$('diff').onclick=e=>{const b=e.target.closest('button');if(!b)return;[...$('diff').children].forEach(x=>x.classList.remove('on'));b.classList.add('on');diff=b.dataset.d;showStart()};
$('acc').onclick=e=>{const b=e.target.closest('button');if(!b)return;[...$('acc').children].forEach(x=>x.classList.remove('on'));b.classList.add('on');accents=b.dataset.a==='1';showStart()};
$('restart').onclick=()=>start();
function showStart(){state='idle';card('TypeRush','<b>'+WORDS.length.toLocaleString('pt')+'</b> palavras em português. Escreve cada palavra antes do tempo acabar. Tens 3 vidas.<br>Recorde: <b>'+best+'</b>',null,'Começar  ⏎')}
showStart();
</script>
</body>
</html>
